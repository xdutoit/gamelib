<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>sandbox 1: rectangle</title>
  <link rel="stylesheet" href="style/gl_style_light.css" />
  <script src="script/gamelib.js"></script>
  <script>
    function init() {
      GL.inclure('element1', 'rect1');
      GL.setXY('element1', 300, 200);
      GL.dessiner('element1');
    }
  </script>
</head>

<body>
  Ce canvas contient un rectangle nommé <em>element1</em><br />
  <canvas id="cnv_jeu_gl" width=600 height=400>
  </canvas><br />
  Affichez la console pour appeler des fonctions.
  <br />
  <div style="display:none">
    <img id="rect1" src="image/rectangle.svg" />
  </div>
</body>

</html>
